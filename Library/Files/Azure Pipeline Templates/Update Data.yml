# generated by @@EwlInitialism

parameters:
- name: isuContainerImage
  type: string
- name: serviceConnection
  type: string
- name: subscription
  type: string
- name: resourceGroup
  type: string
- name: containerAppJob
  type: string
- name: isuInstallationStorageContainer
  type: string
- name: isuJobContainerUrl
  type: string
- name: installation
  type: string
- name: source
  type: string
- name: sourceType
  type: string

jobs:
- job: UpdateData
  pool:
    vmImage: 'ubuntu-latest'
  steps:
  - task: AzureCLI@2
    inputs:
      azureSubscription: '${{ parameters.serviceConnection }}'
      scriptType: 'pscore'
      scriptLocation: 'inlineScript'
      inlineScript: |
        $execution = az containerapp job start `
          --name "${{ parameters.containerAppJob }}" `
          --resource-group "${{ parameters.resourceGroup }}" `
          --query name -o tsv
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        $record = @{
          args  = @("${{ parameters.installation }}", "UpdateData", "${{ parameters.source }}", "${{ parameters.sourceType }}")
          env   = @{ EwlConfigurationStorageContainer = "${{ parameters.isuInstallationStorageContainer }}" }
          input = ""
        } | ConvertTo-Json -Compress
        az storage blob upload `
          --blob-url "${{ parameters.isuJobContainerUrl }}/$execution.json" `
          --data $record `
          --overwrite true `
          --content-type "application/json" `
          --auth-mode login
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        while ($true) {
          $status = az containerapp job execution show `
            --name "${{ parameters.containerAppJob }}" `
            --resource-group "${{ parameters.resourceGroup }}" `
            --job-execution-name $execution `
            --query properties.status -o tsv
          if ($status -eq "Succeeded") { break }
          if ($status -eq "Failed") {
            Write-Host "Failed to update data."
            exit 1
          }
          Start-Sleep -Seconds 10
        }
    displayName: 'Start job'
