# generated by @@EwlInitialism

parameters:
- name: installationName
  type: string
- name: serviceConnection
  type: string
- name: resourceGroup
  type: string
- name: containerImage
  type: string
- name: containerAppJob
  type: string
- name: isuInstallationUrl
  type: string
- name: appService
  type: string
- name: deploymentSlot
  type: string
  default: ''
- name: resourceGroupOverride
  type: string
  default: ''
- name: appServiceOverride
  type: string
  default: ''

jobs:
- job: Deploy
  pool:
    vmImage: 'ubuntu-latest'
  steps:

  - pwsh: |
      $resourceGroup = if ("${{ parameters.resourceGroupOverride }}") { "${{ parameters.resourceGroupOverride }}" } else { "${{ parameters.resourceGroup }}" }
      $appService = if ("${{ parameters.appServiceOverride }}") { "${{ parameters.appServiceOverride }}" } else { "${{ parameters.appService }}" }
      $deploymentSlot = "${{ parameters.deploymentSlot }}"

      if ($deploymentSlot) {
        $slotArgs = "--slot $deploymentSlot"
        $deployToSlot = "true"
        $kuduHostName = "$appService-$deploymentSlot.scm.azurewebsites.net"
      } else {
        $slotArgs = ""
        $deployToSlot = "false"
        $kuduHostName = "$appService.scm.azurewebsites.net"
      }

      Write-Host "##vso[task.setvariable variable=ResourceGroup]$resourceGroup"
      Write-Host "##vso[task.setvariable variable=AppService]$appService"
      Write-Host "##vso[task.setvariable variable=DeploymentSlot]$deploymentSlot"
      Write-Host "##vso[task.setvariable variable=SlotArgs]$slotArgs"
      Write-Host "##vso[task.setvariable variable=DeployToSlot]$deployToSlot"
      Write-Host "##vso[task.setvariable variable=KuduHostName]$kuduHostName"
    displayName: 'Resolve deployment parameters'

  - task: DownloadPipelineArtifact@2
    inputs:
      buildType: 'specific'
      project: '$(System.TeamProjectId)'
      definition: '$(resources.pipeline.build.pipelineID)'
      specificBuildWithTriggering: true
      artifactName: 'Server Side Logic'
      targetPath: '$(Pipeline.Workspace)/ServerSideLogic'
    displayName: 'Download server-side logic'

  - task: DownloadPipelineArtifact@2
    inputs:
      buildType: 'specific'
      project: '$(System.TeamProjectId)'
      definition: '$(resources.pipeline.build.pipelineID)'
      specificBuildWithTriggering: true
      artifactName: '${{ parameters.installationName }} Configuration'
      targetPath: '$(Pipeline.Workspace)/ServerSideLogic/Configuration/Installation'
    displayName: 'Download installation configuration'

  - task: AzureCLI@2
    inputs:
      azureSubscription: '${{ parameters.serviceConnection }}'
      scriptType: 'pscore'
      scriptLocation: 'inlineScript'
      inlineScript: |
        az extension add --name containerapp --upgrade
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        az acr login --name ("${{ parameters.containerImage }}" -split '\.')[0]
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        @"
        FROM mcr.microsoft.com/dotnet/aspnet:@@ContainerImageDotNetVersion
        WORKDIR /app
        COPY . .
        ENTRYPOINT ["dotnet"]
        "@ | Set-Content "$(Pipeline.Workspace)/Dockerfile"

        docker build -t "${{ parameters.containerImage }}" -f "$(Pipeline.Workspace)/Dockerfile" "$(Pipeline.Workspace)/ServerSideLogic"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        docker push "${{ parameters.containerImage }}"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        az containerapp job registry set `
          --name "${{ parameters.containerAppJob }}" `
          --resource-group "$(ResourceGroup)" `
          --server ("${{ parameters.containerImage }}" -split '/')[0] `
          --identity "system"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        az containerapp job update `
          --name "${{ parameters.containerAppJob }}" `
          --resource-group "$(ResourceGroup)" `
          --image "${{ parameters.containerImage }}"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    displayName: 'Build and push container image'

  - task: AzureCLI@2
    inputs:
      azureSubscription: '${{ parameters.serviceConnection }}'
      scriptType: 'pscore'
      scriptLocation: 'inlineScript'
      inlineScript: |
        $isuInstallationPath = "$(Pipeline.Workspace)/IsuInstallation"
        New-Item -ItemType Directory -Path "$isuInstallationPath/Configuration" -Force | Out-Null
        Copy-Item -Recurse "$(Pipeline.Workspace)/ServerSideLogic/Configuration/*" "$isuInstallationPath/Configuration"

        $migratorDir = "$(Pipeline.Workspace)/ServerSideLogic/Data Migrator"
        if (Test-Path $migratorDir) {
          New-Item -ItemType Directory -Path "$isuInstallationPath/Data Migrator" -Force | Out-Null
          Set-Content "$isuInstallationPath/Data Migrator/.placeholder" ""
        }

        $zipPath = "$(Pipeline.Workspace)/IsuInstallation.zip"
        Compress-Archive -Path "$isuInstallationPath/*" -DestinationPath $zipPath

        az storage blob upload `
          --blob-url "${{ parameters.isuInstallationUrl }}" `
          --file $zipPath `
          --overwrite true `
          --auth-mode login
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    displayName: 'Upload ISU installation'

  # Azure App Service does not support configuring modules in web.config
  - pwsh: |
      $webConfigPath = "$(Pipeline.Workspace)/ServerSideLogic/Website/web.config"
      [xml]$webConfig = Get-Content $webConfigPath
      $sysWebServer = $webConfig.configuration.location.'system.webServer'
      $sysWebServer.RemoveChild($sysWebServer.modules) | Out-Null
      $webConfig.Save($webConfigPath)
    displayName: 'Remove modules element from web.config'

  - task: AzureCLI@2
    inputs:
      azureSubscription: '${{ parameters.serviceConnection }}'
      scriptType: 'pscore'
      scriptLocation: 'inlineScript'
      inlineScript: |
        az webapp stop --resource-group "$(ResourceGroup)" --name "$(AppService)" $(SlotArgs)
    displayName: 'Stop app'

  - task: AzureWebApp@1
    inputs:
      azureSubscription: '${{ parameters.serviceConnection }}'
      appType: 'webApp'
      appName: '$(AppService)'
      resourceGroupName: '$(ResourceGroup)'
      package: '$(Pipeline.Workspace)/ServerSideLogic'
      deployToSlotOrASE: '$(DeployToSlot)'
      slotName: '$(DeploymentSlot)'
      deploymentMethod: 'zipDeploy'
    displayName: 'Upload logic to app service'

  # remove IIS modules
  - task: AzureCLI@2
    inputs:
      azureSubscription: '${{ parameters.serviceConnection }}'
      scriptType: 'pscore'
      scriptLocation: 'inlineScript'
      inlineScript: |
        $token = az account get-access-token --query accessToken -o tsv
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        $xdtLines = @(
          '<?xml version="1.0"?>',
          '<configuration xmlns:xdt="http://schemas.microsoft.com/XML-Document-Transform">',
          '  <location path="%XDT_SITENAME%" xdt:Locator="Match(path)" xdt:Transform="InsertIfMissing">',
          '    <system.webServer xdt:Transform="InsertIfMissing">',
          '      <modules xdt:Transform="InsertIfMissing">',
          '        <remove name="OutputCache" xdt:Locator="Match(name)" xdt:Transform="InsertIfMissing" />',
          '        <remove name="Session" xdt:Locator="Match(name)" xdt:Transform="InsertIfMissing" />',
          '        <remove name="WindowsAuthentication" xdt:Locator="Match(name)" xdt:Transform="InsertIfMissing" />',
          '        <remove name="FormsAuthentication" xdt:Locator="Match(name)" xdt:Transform="InsertIfMissing" />',
          '        <remove name="DefaultAuthentication" xdt:Locator="Match(name)" xdt:Transform="InsertIfMissing" />',
          '        <remove name="RoleManager" xdt:Locator="Match(name)" xdt:Transform="InsertIfMissing" />',
          '        <remove name="UrlAuthorization" xdt:Locator="Match(name)" xdt:Transform="InsertIfMissing" />',
          '        <remove name="FileAuthorization" xdt:Locator="Match(name)" xdt:Transform="InsertIfMissing" />',
          '        <remove name="AnonymousIdentification" xdt:Locator="Match(name)" xdt:Transform="InsertIfMissing" />',
          '        <remove name="Profile" xdt:Locator="Match(name)" xdt:Transform="InsertIfMissing" />',
          '        <remove name="UrlMappingsModule" xdt:Locator="Match(name)" xdt:Transform="InsertIfMissing" />',
          '        <remove name="UrlRoutingModule-4.0" xdt:Locator="Match(name)" xdt:Transform="InsertIfMissing" />',
          '        <remove name="ScriptModule-4.0" xdt:Locator="Match(name)" xdt:Transform="InsertIfMissing" />',
          '        <remove name="ServiceModel" xdt:Locator="Match(name)" xdt:Transform="InsertIfMissing" />',
          '        <remove name="ServiceModel-4.0" xdt:Locator="Match(name)" xdt:Transform="InsertIfMissing" />',
          '        <remove name="RewriteModule" xdt:Locator="Match(name)" xdt:Transform="InsertIfMissing" />',
          '        <remove name="AspNetCoreModule" xdt:Locator="Match(name)" xdt:Transform="InsertIfMissing" />',
          '        <remove name="ModSecurity IIS (32bits)" xdt:Locator="Match(name)" xdt:Transform="InsertIfMissing" />',
          '        <remove name="ModSecurity IIS (64bits)" xdt:Locator="Match(name)" xdt:Transform="InsertIfMissing" />',
          '        <remove name="iisnode" xdt:Locator="Match(name)" xdt:Transform="InsertIfMissing" />',
          '        <remove name="ApplicationRequestRouting" xdt:Locator="Match(name)" xdt:Transform="InsertIfMissing" />',
          '      </modules>',
          '    </system.webServer>',
          '  </location>',
          '</configuration>'
        )
        $xdtBytes = [System.Text.Encoding]::UTF8.GetBytes($xdtLines -join "`n")

        Invoke-RestMethod -Uri "https://$(KuduHostName)/api/vfs/site/applicationHost.xdt" `
          -Method Put `
          -Headers @{Authorization="Bearer $token"; "If-Match"="*"} `
          -Body $xdtBytes `
          -ContentType "application/xml"

        Write-Host "applicationHost.xdt uploaded successfully"
    displayName: 'Upload IIS configuration transform'

  - task: AzureCLI@2
    inputs:
      azureSubscription: '${{ parameters.serviceConnection }}'
      scriptType: 'pscore'
      scriptLocation: 'inlineScript'
      inlineScript: |
        $execution = az containerapp job start `
          --name "${{ parameters.containerAppJob }}" `
          --resource-group "$(ResourceGroup)" `
          --args "@@DataMigratorPath" `
          --query name -o tsv
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        while ($true) {
          $status = az containerapp job execution show `
            --name "${{ parameters.containerAppJob }}" `
            --resource-group "$(ResourceGroup)" `
            --job-execution-name $execution `
            --query properties.status -o tsv
          if ($status -eq "Succeeded") { break }
          if ($status -eq "Failed") {
            Write-Host "Failed to migrate data."
            exit 1
          }
          Start-Sleep -Seconds 10
        }
    displayName: 'Run data migrator'

  - task: AzureCLI@2
    inputs:
      azureSubscription: '${{ parameters.serviceConnection }}'
      scriptType: 'pscore'
      scriptLocation: 'inlineScript'
      inlineScript: |
        az webapp start --resource-group "$(ResourceGroup)" --name "$(AppService)" $(SlotArgs)
    displayName: 'Start app'
