# generated by @@EwlInitialism

trigger:
  branches:
    include:
    - master
    - Integration
  paths:
    include:
    - '@@TriggerPath'

pool: EwlBuild

steps:

- task: UseDotNet@2
  inputs:
    version: '@@DotNetVersion'

- task: DotNetCoreCLI@2
  inputs:
    command: 'custom'
    projects: '@@WorkingFolderPath'
    custom: 'restore'
  displayName: 'Restore NuGet dependencies'

- task: PowerShell@2
  inputs:
    targetType: 'inline'
    script: |
      [xml]$projectXml = Get-Content -Path "@@WorkingFolderPath/Library/Library.csproj"
      $ewlReference = $projectXml.Project.ItemGroup.PackageReference | Where-Object {$_.Include -match '^Ewl[A-Za-z0-9]+$'}
      $name = $ewlReference.Include
      $version = $ewlReference.Version

      $nuGetPackageFolderPath = ((dotnet nuget locals global-packages --list) -split ' ', 2)[1].TrimEnd()
      $duPath = Get-ChildItem "$nuGetPackageFolderPath\$name\$version\tools\Development Utility\EnterpriseWebLibrary.DevelopmentUtility.exe"
      Write-Host "##vso[task.setvariable variable=DuPath]$duPath"

      $duInstallationPath = "@@WorkingFolderPath" -replace '/', '\'
      Write-Host "##vso[task.setvariable variable=DuInstallationPath]$duInstallationPath"
  displayName: 'Find EWL Development Utility'

- task: AzureCLI@2
  inputs:
    azureSubscription: 'Azure - Intermediate'
    scriptType: 'ps'
    scriptLocation: 'inlineScript'
    inlineScript: |
      & "$(DuPath)" "$(DuInstallationPath)" UpdateData Default True
  displayName: 'EWL - Update data'

- task: AzureCLI@2
  inputs:
    azureSubscription: 'Azure - Intermediate'
    scriptType: 'ps'
    scriptLocation: 'inlineScript'
    inlineScript: |
      & "$(DuPath)" "$(DuInstallationPath)" UpdateDependentLogic
  displayName: 'EWL - Update dependent logic'

# Restore again to take into account the Directory.Build.props files that we generated.
- task: DotNetCoreCLI@2
  inputs:
    command: 'custom'
    projects: '@@WorkingFolderPath'
    custom: 'restore'
  displayName: 'Restore again after code generation'

- ${{ if ne('@@LegacyWebProjects', '') }}:
  - ${{ each project in split('@@LegacyWebProjects', ',') }}:
    - task: PowerShell@2
      inputs:
        targetType: 'inline'
        script: |
          $path = "@@WorkingFolderPath/${{ project }}/Properties/PublishProfiles/Publish.pubxml"
          New-Item -ItemType Directory -Path ([System.IO.Path]::GetDirectoryName($path)) -Force | Out-Null
          $lines = @(
            '<?xml version="1.0" encoding="utf-8"?>',
            '<Project ToolsVersion="4.0" xmlns="http://schemas.microsoft.com/developer/msbuild/2003">',
            '  <PropertyGroup>',
            '    <WebPublishMethod>FileSystem</WebPublishMethod>',
            '    <PublishProvider>FileSystem</PublishProvider>',
            '    <LastUsedBuildConfiguration>Release</LastUsedBuildConfiguration>',
            '    <LastUsedPlatform>Any CPU</LastUsedPlatform>',
            '    <SiteUrlToLaunchAfterPublish />',
            '    <LaunchSiteAfterPublish>False</LaunchSiteAfterPublish>',
            '    <ExcludeApp_Data>False</ExcludeApp_Data>',
            '    <DeleteExistingFiles>True</DeleteExistingFiles>',
            '    <PrecompileBeforePublish>True</PrecompileBeforePublish>',
            '    <EnableUpdateable>False</EnableUpdateable>',
            '    <DebugSymbols>True</DebugSymbols>',
            '    <WDPMergeOption>DonotMerge</WDPMergeOption>',
            '  </PropertyGroup>',
            '</Project>'
          )
          [System.IO.File]::WriteAllLines($path, $lines, [System.Text.Encoding]::UTF8)
      displayName: 'Write publish profile for ${{ project }}'

    - task: MSBuild@1
      inputs:
        solution: '@@WorkingFolderPath/${{ project }}/${{ project }}.csproj'
        msbuildArchitecture: 'x64'
        configuration: 'Release'
        msbuildArguments: '/p:PublishProfile=Publish /p:DeployOnBuild=true /p:AspnetMergePath="@@DotNetToolsFolderPath" "/p:publishurl=$(DuInstallationPath)\Logic Packages\Server Side Logic\${{ project }}" /p:MvcBuildViews=false'
      displayName: 'Publish ${{ project }}'

- task: PowerShell@2
  inputs:
    targetType: 'inline'
    script: |
      & "$(DuPath)" "$(DuInstallationPath)" ExportLogic
  displayName: 'EWL - Export logic'

- task: PowerShell@2
  inputs:
    targetType: 'inline'
    script: |
      $logicPackagesPath = "$(DuInstallationPath)\Logic Packages"
      if (Test-Path $logicPackagesPath) {
        $folders = Get-ChildItem -Path $logicPackagesPath -Directory
        foreach ($folder in $folders) {
          Write-Host "##vso[artifact.upload containerfolder=$($folder.Name);artifactname=$($folder.Name)]$($folder.FullName)"
        }
      }
  displayName: 'Publish artifacts'
