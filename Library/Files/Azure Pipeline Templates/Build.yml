# generated by @@EwlInitialism

trigger:
  branches:
    include:
    - master
    - Integration
  paths:
    include:
    - '@@TriggerPath'

pool: EwlBuild

steps:

- task: UseDotNet@2
  inputs:
    version: '@@DotNetVersion'

- task: DotNetCoreCLI@2
  inputs:
    command: 'custom'
    projects: '@@WorkingFolderPath'
    custom: 'restore'
  displayName: 'Restore NuGet dependencies'

- task: AzureCLI@2
  inputs:
    azureSubscription: 'Azure - Intermediate'
    scriptType: 'ps'
    scriptLocation: 'inlineScript'
    inlineScript: |
      dotnet ewl update-data Default True
    workingDirectory: '@@WorkingFolderPath'
  displayName: 'EWL - Update data'

- task: AzureCLI@2
  inputs:
    azureSubscription: 'Azure - Intermediate'
    scriptType: 'ps'
    scriptLocation: 'inlineScript'
    inlineScript: |
      dotnet ewl sync
    workingDirectory: '@@WorkingFolderPath'
  displayName: 'EWL - Sync'

# Restore again to take into account the Directory.Build.props files that we generated.
- task: DotNetCoreCLI@2
  inputs:
    command: 'custom'
    projects: '@@WorkingFolderPath'
    custom: 'restore'
  displayName: 'Restore again after code generation'

- task: PowerShell@2
  inputs:
    targetType: 'inline'
    script: |
      dotnet ewl export-logic
    workingDirectory: '@@WorkingFolderPath'
  displayName: 'EWL - Export logic'

- task: PowerShell@2
  inputs:
    targetType: 'inline'
    script: |
      $logicPackagesPath = "@@WorkingFolderPath/Logic Packages"
      if (Test-Path $logicPackagesPath) {
        $folders = Get-ChildItem -Path $logicPackagesPath -Directory
        foreach ($folder in $folders) {
          Write-Host "##vso[artifact.upload containerfolder=$($folder.Name);artifactname=$($folder.Name)]$($folder.FullName)"
        }
      }
  displayName: 'Publish artifacts'
