trigger:
  branches:
    include:
    - master
    - Integration
  paths:
    include:
    - '@@TriggerPath'

pool: EwlBuild

steps:
- task: UseDotNet@2
  inputs:
    version: '@@DotNetVersion'

- task: DotNetCoreCLI@2
  inputs:
    command: 'custom'
    projects: '@@WorkingFolderPath'
    custom: 'restore'
  displayName: 'Restore NuGet dependencies'